{{ $p := . }}
<footer class="article__footer">
  {{ with $p.Params.tags }}
  <ul class="chip-row">
    {{ range . }}<li>{{ partial "icon.html" "tag" }}{{ . }}</li>{{ end }}
  </ul>
  {{ end }}

  <div class="share">
    <span class="share__label">Share this</span>
    <a class="share__btn" href="https://twitter.com/intent/tweet?url={{ $p.Permalink }}&text={{ $p.Title }}" target="_blank" rel="noopener" aria-label="Share on X">X</a>
    <a class="share__btn" href="https://www.linkedin.com/sharing/share-offsite/?url={{ $p.Permalink }}" target="_blank" rel="noopener" aria-label="Share on LinkedIn">LinkedIn</a>
    <button class="share__btn" type="button" data-copy="{{ $p.Permalink }}">Copy link</button>
  </div>
</footer>
