<!DOCTYPE html>
<html lang="{{ site.Language.Lang | default "en" }}" data-theme="dark">
<head>
  {{ partial "head.html" . }}
</head>
<body class="{{ if .IsHome }}is-home{{ end }}">
  <a class="skip-link" href="#main">Skip to content</a>
  {{ partial "nav.html" . }}
  <main id="main">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  <div class="lightbox" id="lightbox" hidden>
    <button class="lightbox__close" id="lightbox-close" aria-label="Close">{{ partial "icon.html" "close" }}</button>
    <figure class="lightbox__inner">
      <img id="lightbox-img" src="" alt="">
      <figcaption id="lightbox-caption"></figcaption>
    </figure>
  </div>
  {{ partial "scripts.html" . }}
</body>
</html>
